# Spike S3 (intent 0003): can claude-code-action post an inline review comment
# with the claude-review token (contents read; pull requests and issues write)?
# Throwaway: lives only on the sandbox branch spike/s3-s4.
name: spike-s3
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  inline:
    if: github.event.pull_request.head.ref == 'spike/s3-s4'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint the tclaude token (claude-review permissions)
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Claude posts one inline comment
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.token.outputs.token }}
          show_full_output: false
          # Post at once; otherwise a spike comment may be classed as a probe and dropped.
          classify_inline_comments: "false"
          prompt: |
            This is spike S3 for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Use the create_inline_comment tool once, with confirmed set to true, on line 3 of docs/spike-s3.md,
            with the body "Spike S3: inline comment posted with the jomaries777-tclaude token."
            Post nothing else. Never approve and never request changes.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 4
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
